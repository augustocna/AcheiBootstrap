<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achei! · Busca de classes Bootstrap</title>
  <meta name="description" content="Digite o que você quer fazer e descubra a classe Bootstrap certa, com exemplo ao vivo.">

  <!-- Bootswatch Quartz (Bootstrap 5) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css">
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <a class="pular-link" href="#resultados">Pular para os resultados</a>

  <header class="topo">
    <div class="container">
      <div class="topo-linha">
        <div class="marca">
          <span class="marca-nome">Achei!</span>
          <span class="marca-sub">classes Bootstrap</span>
        </div>
        <div class="contador" id="contador" aria-live="polite"></div>
      </div>

      <h1 class="titulo">O que você quer fazer<span class="titulo-ponto">?</span></h1>

      <div class="busca-caixa">
        <svg class="busca-icone" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <input id="busca" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               aria-label="Buscar classe Bootstrap" placeholder=" ">
        <span class="busca-fantasma" id="fantasma" aria-hidden="true"></span>
        <button class="busca-limpar" id="limpar" type="button" aria-label="Limpar busca" hidden>✕</button>
        <kbd class="busca-atalho" id="atalho" aria-hidden="true">/</kbd>
      </div>

      <p class="dica-busca">
        Escreva em português ou em inglês, do jeito que vier na cabeça: <em>“centralizar”</em>,
        <em>“btn”</em>, <em>“esconder no celular”</em>.
      </p>

      <nav class="chips" id="chips" aria-label="Filtrar por categoria"></nav>
    </div>
  </header>

  <main class="container principal">
    <div class="barra-status" id="status" aria-live="polite"></div>
    <div id="resultados" class="lista" role="list"></div>
    <div id="vazio" class="vazio" hidden></div>
  </main>

  <footer class="rodape container">
    <p>Feito pra quem está aprendendo. Clique em qualquer classe pra copiar.</p>
  </footer>

  <div class="aviso-copiado" id="aviso" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dados.js"></script>
  <script src="busca.js"></script>
  <script src="app.js"></script>
</body>
</html>
